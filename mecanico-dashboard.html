<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mecánico - Special Car</title>
    <link rel="stylesheet" href="css/styles.css">
    <header class="header" style="background:white;box-shadow:0 2px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100;">
    <div style="max-width:1400px;margin:0 auto;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:1.25rem;font-weight:700;color:var(--primary);">
            🔧 Dashboard Mecánico
        </div>
        <button onclick="history.back()" class="btn btn-secondary">
            ← Volver
        </button>
    </div>
    </header>
    <style>
        .layout { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
        .sidebar { background:var(--gray-900); color:white; padding:1.5rem 1rem; }
        .sidebar nav a {
            display:flex; align-items:center; gap:.75rem;
            padding:.75rem 1rem; color:rgba(255,255,255,.7);
            text-decoration:none; border-radius:.5rem; margin-bottom:.25rem;
            transition:all .3s;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background:rgba(255,255,255,.1); color:white;
        }
        .main { background:var(--gray-50); padding:2rem; }
        .section { display:none; }
        .section.active { display:block; }
        .metrics { 
            display:grid; 
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); 
            gap:1rem; 
            margin-bottom:2rem; 
        }
        .metric {
            background:white; padding:1.5rem; border-radius:.75rem;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
            border-left:4px solid var(--primary);
        }
        .metric.warning { border-left-color:var(--warning); }
        .metric.success { border-left-color:var(--success); }
        .metric-value { font-size:2rem; font-weight:700; color:var(--primary); }
        .metric.warning .metric-value { color:var(--warning); }
        .metric.success .metric-value { color:var(--success); }
        .metric-label { color:var(--gray-700); font-size:.875rem; margin-top:.25rem; }
        .ot-card {
            background:white; padding:1.5rem; border-radius:.75rem;
            box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:1rem;
        }
        .ot-header {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:1rem; padding-bottom:1rem;
            border-bottom:2px solid var(--gray-100);
        }
        .checklist-item {
            padding:.75rem; background:var(--gray-50);
            border-radius:.5rem; margin-bottom:.5rem;
            display:flex; justify-content:space-between; align-items:center;
        }
        .solicitud-form {
            background:var(--gray-50); padding:1.5rem;
            border-radius:.75rem; margin-top:1rem;
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2rem;">🔧</div>
            <h3 style="color:white; margin:.5rem 0 0;">Special Car</h3>
            <small style="color:rgba(255,255,255,.6);" id="rolUsuario">Mecánico</small>
        </div>
        <nav>
            <a href="#" class="active" onclick="cambiarSeccion('dashboard',this)">📊 Mis OTs</a>
            <a href="#" onclick="cambiarSeccion('historial',this)">📋 Historial Vehículos</a>
            <a href="#" onclick="cambiarSeccion('solicitudes',this)">⚠️ Mis Solicitudes</a>
            <a href="#" onclick="cambiarSeccion('clientes',this)">👥 Clientes</a>
        </nav>
        <div class="sidebar-footer">
            <p id="nombreUsuario">...</p>
            <button onclick="cerrarSesion()" class="btn btn-secondary" style="width:100%;">
            🚪 Salir
            </button>
        </div>
    </aside>
    <main class="main">
        <!-- DASHBOARD -->
        <section id="dashboard" class="section active">
            <h1>🔧 Mis Órdenes de Trabajo</h1>
            
            <div class="metrics">
                <div class="metric warning">
                    <div class="metric-value" id="misOTsPendientes">-</div>
                    <div class="metric-label">⏳ Pendientes</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="misOTsEnProceso">-</div>
                    <div class="metric-label">🔧 En Proceso</div>
                </div>
                <div class="metric success">
                    <div class="metric-value" id="misOTsCompletadas">-</div>
                    <div class="metric-label">✅ Completadas Este Mes</div>
                </div>
            </div>

            <div id="listaOTs"></div>
        </section>

        <!-- HISTORIAL VEHÍCULOS -->
        <section id="historial" class="section">
            <h1>📋 Historial de Vehículos</h1>
            <div class="card" style="margin-bottom:1rem;">
                <input type="text" id="buscarPlaca" class="form-control"
                       placeholder="Buscar por placa..."
                       oninput="buscarHistorialVehiculo()">
            </div>
            <div id="historialContainer"></div>
        </section>

        <!-- SOLICITUDES -->
        <section id="solicitudes" class="section">
            <h1>⚠️ Mis Solicitudes de Modificación</h1>
            <div id="listaSolicitudesMecanico"></div>
        </section>

        <!-- CLIENTES -->
        <section id="clientes" class="section">
            <h1>👥 Clientes Atendidos</h1>
            <div id="listaClientesMecanico"></div>
        </section>
    </main>
</div>

<script type="module" src="js/mecanico-dashboard.js"></script>
</body>
</html>
