<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Special Car</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Special Car - Proveedores</div>
            <nav>
                <button onclick="location.href='almacen-dashboard.html'" class="btn btn-secondary">
                    ← Volver
                </button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
            <h1>📦 Gestión de Proveedores</h1>
            <button onclick="abrirModalProveedor()" class="btn btn-primary">
                + Nuevo Proveedor
            </button>
        </div>

        <div class="card" style="margin-bottom:1rem;">
            <input type="text" id="buscarProveedor" class="form-control"
                   placeholder="Buscar por razón social, NIT..."
                   oninput="filtrarProveedores()">
        </div>

        <div id="tablaProveedores"></div>
    </div>

    <!-- MODAL PROVEEDOR -->
    <div class="modal" id="modalProveedor">
        <div class="modal-content" style="max-width:800px;">
            <h2 id="tituloModal">Nuevo Proveedor</h2>
            <form id="formProveedor">
                <input type="hidden" id="proveedorId">
                
                <h3>Información General</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Razón Social *</label>
                        <input type="text" id="razonSocial" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>NIT *</label>
                        <input type="text" id="nit" class="form-control" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre Comercial</label>
                        <input type="text" id="nombreComercial" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Tipo Persona</label>
                        <select id="tipoPersona" class="form-control">
                            <option value="juridica">Jurídica</option>
                            <option value="natural">Natural</option>
                        </select>
                    </div>
                </div>

                <h3>Contacto</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="telefono" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" id="direccion" class="form-control">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="ciudad" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Sitio Web</label>
                        <input type="url" id="sitioWeb" class="form-control">
                    </div>
                </div>

                <h3>Términos Comerciales</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Días de Crédito</label>
                        <input type="number" id="diasCredito" class="form-control" value="30">
                    </div>
                    <div class="form-group">
                        <label>Método de Pago Preferido</label>
                        <select id="metodoPago" class="form-control">
                            <option value="transferencia">Transferencia</option>
                            <option value="cheque">Cheque</option>
                            <option value="efectivo">Efectivo</option>
                        </select>
                    </div>
                </div>

                <h3>Información Bancaria</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Banco</label>
                        <input type="text" id="banco" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Cuenta</label>
                        <select id="tipoCuenta" class="form-control">
                            <option value="">Seleccionar...</option>
                            <option value="ahorros">Ahorros</option>
                            <option value="corriente">Corriente</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Número de Cuenta</label>
                    <input type="text" id="numeroCuenta" class="form-control">
                </div>

                <h3>Contacto Comercial</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="contactoNombre" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Cargo</label>
                        <input type="text" id="contactoCargo" class="form-control">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="contactoTelefono" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="contactoEmail" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="notas" class="form-control" rows="3"></textarea>
                </div>

                <div style="display:flex;gap:1rem;margin-top:1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">💾 Guardar</button>
                    <button type="button" onclick="cerrarModal()" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/proveedores.js"></script>
</body>
</html>
